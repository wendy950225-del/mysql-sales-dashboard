<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MySQL Sales Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #ffffff;
      padding: 24px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 10px;
    }

    header p {
      margin: 0;
      color: #666;
    }

    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .status {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      line-height: 1.8;
    }

    .status-row {
      margin-bottom: 6px;
    }

    .version {
      font-weight: bold;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      margin-top: 0;
      font-size: 16px;
      color: #666;
    }

    .card .value {
      font-size: 28px;
      font-weight: bold;
    }

    .chart-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    canvas {
      max-height: 400px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    button:hover {
      opacity: 0.85;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>MySQL Sales Dashboard</h1>
  <p>即時讀取 Aiven MySQL 資料</p>
</header>

<div class="container">

  <div class="status">

    <div class="status-row">
      <strong>資料庫狀態：</strong>
      <span id="status">讀取中...</span>
    </div>

    <div class="status-row">
      <strong>目前資料版本：</strong>
      <span id="dataVersion" class="version">--</span>
    </div>

    <div class="status-row">
      <strong>最後更新：</strong>
      <span id="lastUpdate">--</span>
    </div>

    <button onclick="loadDashboard()">
      重新整理資料
    </button>

  </div>


  <div class="cards">

    <div class="card">
      <h3>資料筆數</h3>
      <div class="value" id="records">--</div>
    </div>

    <div class="card">
      <h3>銷售數量</h3>
      <div class="value" id="quantity">--</div>
    </div>

    <div class="card">
      <h3>退貨數量</h3>
      <div class="value" id="returns">--</div>
    </div>

    <div class="card">
      <h3>淨銷售額</h3>
      <div class="value" id="revenue">--</div>
    </div>

  </div>


  <div class="chart-box">
    <h2>每日淨銷售額</h2>
    <canvas id="dailyChart"></canvas>
  </div>


  <div class="chart-box">
    <h2>各商品淨銷售額</h2>
    <canvas id="productChart"></canvas>
  </div>


  <div class="chart-box">
    <h2>各分類淨銷售額</h2>
    <canvas id="categoryChart"></canvas>
  </div>

</div>


<script>

/*
==================================================
這裡一定要改成你的 Render 網址
不要加 /api/summary
不要在最後加 /
==================================================
*/

const API_URL = "https://mysql-sales-dashboard-w558.onrender.com/";


let dailyChart;
let productChart;
let categoryChart;


/*
==================================================
共用 fetch 函式
每次都加時間戳記，避免瀏覽器使用舊快取
==================================================
*/

async function fetchAPI(path) {

  const response = await fetch(
    API_URL + path + "?t=" + Date.now(),
    {
      cache: "no-store"
    }
  );

  if (!response.ok) {
    throw new Error(
      "API 錯誤：" +
      response.status +
      " " +
      response.statusText
    );
  }

  return await response.json();
}


/*
==================================================
載入整個 Dashboard
==================================================
*/

async function loadDashboard() {

  document.getElementById("status").innerText =
    "⏳ 正在讀取 MySQL...";

  try {

    /*
    ----------------------------------------------
    1. 取得 Summary
    ----------------------------------------------
    */

    const summary =
      await fetchAPI("/api/summary");


    document.getElementById("records").innerText =
      Number(summary.records).toLocaleString();

    document.getElementById("quantity").innerText =
      Number(summary.total_quantity).toLocaleString();

    document.getElementById("returns").innerText =
      Number(summary.total_returns).toLocaleString();

    document.getElementById("revenue").innerText =
      "NT$ " +
      Number(summary.net_revenue).toLocaleString();


    /*
    ----------------------------------------------
    2. 取得目前資料版本
    ----------------------------------------------
    */

    const versionData =
      await fetchAPI("/api/version");


    document.getElementById("dataVersion").innerText =
      versionData.version;


    /*
    ----------------------------------------------
    3. 每日銷售資料
    ----------------------------------------------
    */

    const dailyData =
      await fetchAPI("/api/daily");


    /*
    ----------------------------------------------
    4. 商品銷售資料
    ----------------------------------------------
    */

    const productData =
      await fetchAPI("/api/products");


    /*
    ----------------------------------------------
    5. 分類銷售資料
    ----------------------------------------------
    */

    const categoryData =
      await fetchAPI("/api/categories");


    /*
    ----------------------------------------------
    6. 畫圖
    ----------------------------------------------
    */

    drawDailyChart(dailyData);

    drawProductChart(productData);

    drawCategoryChart(categoryData);


    /*
    ----------------------------------------------
    7. 狀態更新
    ----------------------------------------------
    */

    document.getElementById("status").innerText =
      "✅ MySQL Connected";

    document.getElementById("lastUpdate").innerText =
      new Date().toLocaleString("zh-TW");


  } catch (error) {

    console.error(error);

    document.getElementById("status").innerText =
      "❌ 資料讀取失敗";

    document.getElementById("dataVersion").innerText =
      "--";

    alert(
      "資料讀取失敗。\n\n" +
      "請確認 Render API 是否正常。\n\n" +
      error.message
    );
  }
}


/*
==================================================
每日淨銷售額折線圖
==================================================
*/

function drawDailyChart(data) {

  if (dailyChart) {
    dailyChart.destroy();
  }

  const ctx =
    document.getElementById("dailyChart");


  dailyChart =
    new Chart(ctx, {

      type: "line",

      data: {

        labels:
          data.map(row => row.sale_date),

        datasets: [{
          label: "每日淨銷售額",

          data:
            data.map(row =>
              Number(row.net_revenue)
            ),

          tension: 0.3
        }]
      },

      options: {

        responsive: true,

        plugins: {

          tooltip: {
            callbacks: {
              label: function(context) {
                return (
                  "NT$ " +
                  Number(
                    context.raw
                  ).toLocaleString()
                );
              }
            }
          }

        },

        scales: {

          y: {
            beginAtZero: true,

            ticks: {
              callback: function(value) {
                return (
                  "NT$ " +
                  Number(value).toLocaleString()
                );
              }
            }
          }

        }

      }

    });

}


/*
==================================================
各商品淨銷售額長條圖
==================================================
*/

function drawProductChart(data) {

  if (productChart) {
    productChart.destroy();
  }

  const ctx =
    document.getElementById("productChart");


  productChart =
    new Chart(ctx, {

      type: "bar",

      data: {

        labels:
          data.map(row => row.product_name),

        datasets: [{
          label: "商品淨銷售額",

          data:
            data.map(row =>
              Number(row.net_revenue)
            )
        }]
      },

      options: {

        responsive: true,

        plugins: {

          tooltip: {
            callbacks: {
              label: function(context) {
                return (
                  "NT$ " +
                  Number(
                    context.raw
                  ).toLocaleString()
                );
              }
            }
          }

        },

        scales: {

          y: {
            beginAtZero: true,

            ticks: {
              callback: function(value) {
                return (
                  "NT$ " +
                  Number(value).toLocaleString()
                );
              }
            }
          }

        }

      }

    });

}


/*
==================================================
各分類淨銷售額圓餅圖
==================================================
*/

function drawCategoryChart(data) {

  if (categoryChart) {
    categoryChart.destroy();
  }

  const ctx =
    document.getElementById("categoryChart");


  categoryChart =
    new Chart(ctx, {

      type: "pie",

      data: {

        labels:
          data.map(row => row.category),

        datasets: [{

          data:
            data.map(row =>
              Number(row.net_revenue)
            )

        }]
      },

      options: {

        responsive: true,

        plugins: {

          tooltip: {

            callbacks: {

              label: function(context) {

                const value =
                  Number(context.raw);

                return (
                  context.label +
                  ": NT$ " +
                  value.toLocaleString()
                );

              }

            }

          }

        }

      }

    });

}


/*
==================================================
網頁第一次開啟時自動載入
==================================================
*/

loadDashboard();

</script>

</body>
</html>
